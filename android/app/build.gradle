plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'  // Ensure the Flutter plugin is applied correctly
    id "com.google.gms.google-services" // Add the Google services Gradle plugin here
}

android {

     buildTypes {
        release {
            
         minifyEnabled true // Disable R8 temporarily to test
        signingConfig signingConfigs.debug // Use your own release signing config
        }
    }
    namespace = "com.example.kmcalert"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "com.example.kmcalert" // Unique Application ID
        minSdkVersion 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }


    buildTypes {
        release {
            signingConfig = signingConfigs.debug // Set signing config (use release config in production)
        }
    }
}

flutter {
    source = "../.." // Ensure this points to your Flutter module source (root of the Flutter project)
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics'
     coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
}