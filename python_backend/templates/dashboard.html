<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMC Service Provider Dashboard</title>
    <!-- Bootstrap CSS for responsive design -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS for mapping -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- SocketIO JS for real-time updates -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        #map { height: 400px; margin-top: 20px; }
        .alert-row:hover { background-color: #f5f5f5; cursor: pointer; }
        .loading { display: none; text-align: center; margin: 10px 0; color: #666; font-style: italic; }
        .path-line { stroke: #ff0000; stroke-width: 5; opacity: 0.7; }
        .error-message { color: red; display: none; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1>KMC Service Provider Dashboard</h1>
        <p>Click "Respond" to update the status of an alert.</p>

        <!-- Service type filter dropdown -->
        <div class="mb-3">
            <label for="serviceFilter" class="form-label">Filter by Service Type:</label>
            <select id="serviceFilter" class="form-select w-25">
                <option value="all">All</option>
                <option value="ambulance">Ambulance</option>
                <option value="firefighter">Fire Station</option>
                <option value="policeman">Police</option>
                <option value="sewage">Sewage</option>
                <option value="garbage">Garbage</option>
                <option value="illegalparking">Illegal Parking</option>
            </select>
        </div>

        <!-- Alerts table -->
        <table class="table table-striped" id="alertTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Service Type</th>
                    <th>Provider Name</th>
                    <th>Service Provider Location</th>
                    <th>User Location</th>
                    <th>User Place</th>
                    <th>Timestamp</th>
                    <th>Phone Number</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Alerts will be dynamically added here -->
            </tbody>
        </table>

        <!-- Loading indicator for initial data fetch -->
        <div id="loading" class="loading">Loading initial alerts...</div>

        <!-- Leaflet map for visualizing alerts -->
        <div id="map"></div>

        <!-- Error message display -->
        <div id="errorMessage" class="error-message"></div>
    </div>

    <!-- Bootstrap JS for interactive components -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet JS for map functionality -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = null;
        let currentPath = null;
        let alerts = new Map(); // Store alerts by ID for updates
        let markers = []; // Track markers to clear them
        let socket = null;

        function initMap() {
            map = L.map('map').setView([27.7172, 85.3240], 13); // Default to Kathmandu
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
        }

        function clearMap() {
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];
            if (currentPath) {
                map.removeLayer(currentPath);
                currentPath = null;
            }
        }

        function addAlertToTable(alert) {
            const tbody = document.getElementById('alertTable').querySelector('tbody');
            const row = document.createElement('tr');
            row.setAttribute('data-id', alert.id);
            row.className = 'alert-row';
            
            // Normalize status for comparison
            const status = alert.status ? alert.status.toLowerCase() : 'pending';
            
            row.innerHTML = `
    <td>${alert.id}</td>
    <td>${alert.service_type}</td>
    <td>${alert.provider_name}</td>
    <td>${alert.nearest_service.service_latitude}, ${alert.nearest_service.service_longitude}</td>
    <td>${alert.user_latitude}, ${alert.user_longitude}</td>
    <td>${alert.user_place_name || 'Unknown Location'}</td>
    <td>${new Date(alert.timestamp).toLocaleString()}</td>
    <td>${alert.phone_number || 'N/A'}</td>
    <td>
        <span class="status-text">${alert.status || 'Pending'}</span>
        ${status !== 'responded' ? `<button class="respond-btn btn btn-sm btn-primary ms-2" data-id="${alert.id}">Respond</button>` : ''}
    </td>
`;
            row.onclick = () => showAlertOnMap(alert);
            tbody.appendChild(row);

            const respondBtn = row.querySelector('.respond-btn');
            if (respondBtn) {
                respondBtn.addEventListener('click', (e) => {
                    e.stopPropagation(); // Prevent row click from triggering map
                    if (confirm('Are you sure you want to respond to this alert?')) {
                        respondToAlert(alert.id, "Responded");
                    }
                });
            }

            alerts.set(alert.id, row);
            applyFilter();
        }

        // function updateAlertInTable(alert) {
        //     const row = alerts.get(alert.id);
        //     if (row) {
        //         // Normalize status for comparison
        //         const status = alert.status ? alert.status.toLowerCase() : 'pending';
                
        //         const statusTd = row.querySelector('td:nth-child(6)');
        //         statusTd.innerHTML = `
        //             <span class="status-text">${alert.status || 'Pending'}</span>
        //             ${status !== 'responded' ? `<button class="respond-btn btn btn-sm btn-primary ms-2" data-id="${alert.id}">Respond</button>` : ''}
        //         `;
        //         const respondBtn = statusTd.querySelector('.respond-btn');
        //         if (respondBtn) {
        //             respondBtn.addEventListener('click', (e) => {
        //                 e.stopPropagation();
        //                 if (confirm('Are you sure you want to respond to this alert?')) {
        //                     respondToAlert(alert.id, "Responded");
        //                 }
        //             });
        //         }
        //         applyFilter();
        //     }
        // }

        function updateAlertInTable(alert) {
    const row = alerts.get(alert.id);
    if (row) {
        // Normalize status for comparison
        const status = alert.status ? alert.status.toLowerCase() : 'pending';
        
        row.innerHTML = `
            <td>${alert.id}</td>
            <td>${alert.service_type}</td>
            <td>${alert.provider_name}</td>
            <td>${alert.nearest_service.service_latitude}, ${alert.nearest_service.service_longitude}</td>
            <td>${alert.user_latitude}, ${alert.user_longitude}</td>
            <td>${alert.user_place_name || 'Unknown Location'}</td>
            <td>${new Date(alert.timestamp).toLocaleString()}</td>
            <td>${alert.phone_number || 'N/A'}</td>
            <td>
                <span class="status-text">${alert.status || 'Pending'}</span>
                ${status !== 'responded' ? `<button class="respond-btn btn btn-sm btn-primary ms-2" data-id="${alert.id}">Respond</button>` : ''}
            </td>
        `;
        const respondBtn = row.querySelector('.respond-btn');
        if (respondBtn) {
            respondBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (confirm('Are you sure you want to respond to this alert?')) {
                    respondToAlert(alert.id, "Responded");
                }
            });
        }
        applyFilter();
    }
}

        function applyFilter() {
            const filter = document.getElementById('serviceFilter').value.toLowerCase();
            const rows = document.querySelectorAll('#alertTable tbody tr');
            rows.forEach(row => {
                const serviceType = row.querySelector('td:nth-child(2)').textContent.toLowerCase();
                row.style.display = (filter === 'all' || serviceType === filter) ? '' : 'none';
            });
        }

        // function showAlertOnMap(alert) {
        //     clearMap();
        //     const userLatLng = [alert.user_latitude, alert.user_longitude];
        //     const serviceLatLng = [alert.nearest_service.service_latitude, alert.nearest_service.service_longitude];
        //     const userMarker = L.marker(userLatLng).addTo(map).bindPopup('User Location');
        //     const serviceMarker = L.marker(serviceLatLng).addTo(map).bindPopup(`${alert.service_type} Location`);
        //     markers.push(userMarker, serviceMarker);
        //     map.fitBounds([userLatLng, serviceLatLng]);
        // }

        function showAlertOnMap(alert) {
    clearMap();
    const userLatLng = [alert.user_latitude, alert.user_longitude];
    const serviceLatLng = [alert.nearest_service.service_latitude, alert.nearest_service.service_longitude];
    const userMarker = L.marker(userLatLng).addTo(map).bindPopup('User Location: ' + (alert.user_place_name || 'Unknown Location'));
    const serviceMarker = L.marker(serviceLatLng).addTo(map).bindPopup(`${alert.service_type} Location: ${alert.provider_name}`);
    markers.push(userMarker, serviceMarker);
    map.fitBounds([userLatLng, serviceLatLng]);
}
function respondToAlert(alertId, responseMessage) {
    const row = alerts.get(alertId);
    if (!row) {
        console.error(`Row for alert ${alertId} not found`);
        return;
    }
    const statusTd = row.querySelector('td:nth-child(9)');
    statusTd.innerHTML = '<div class="loading">Sending...</div>';

    console.log(`Sending response for alert ${alertId} with message: ${responseMessage}`);
    fetch("http://172.16.31.2:5001/respond_to_alert", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ alert_id: alertId, response_message: responseMessage })
    })
    .then(response => {
        console.log(`Response status: ${response.status}`);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        return response.json();
    })
    .then(data => {
        console.log("Response data:", data);
        if (data.status === 200) {
            console.log("Response recorded:", data.message);
            // Immediately update the local row to "Responded" for instant feedback
            statusTd.innerHTML = '<span class="status-text">Responded</span>';
            // Fetch the updated alert to ensure consistency
            fetchAlert(alertId);
        } else {
            throw new Error(data.error || 'Response failed');
        }
    })
    .catch(error => {
        console.error("Response error:", error);
        const status = row.querySelector('.status-text')?.textContent.toLowerCase() || 'pending';
        statusTd.innerHTML = `
            <span class="status-text">${status}</span>
            ${status !== 'responded' ? `<button class="respond-btn btn btn-sm btn-primary ms-2" data-id="${alertId}">Respond</button>` : ''}
        `;
        const respondBtn = statusTd.querySelector('.respond-btn');
        if (respondBtn) {
            respondBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (confirm('Are you sure you want to respond to this alert?')) {
                    respondToAlert(alertId, "Responded");
                }
            });
        }
        document.getElementById('errorMessage').textContent = `Response Error: ${error.message}`;
        document.getElementById('errorMessage').style.display = 'block';
        setTimeout(() => document.getElementById('errorMessage').style.display = 'none', 5000);
    });
}
        function fetchAlert(alertId) {
            fetch(`http://172.16.31.2:5001/api/alerts/${alertId}`)
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response.json();
            })
            .then(data => {
                if (data.status === 200 && data.alerts && data.alerts.length > 0) {
                    updateAlertInTable(data.alerts[0]);
                } else {
                    throw new Error(data.error || 'Alert fetch failed');
                }
            })
            .catch(error => {
                console.error("Fetch alert error:", error);
                document.getElementById('errorMessage').textContent = `Fetch Error: ${error.message}`;
                document.getElementById('errorMessage').style.display = 'block';
                setTimeout(() => document.getElementById('errorMessage').style.display = 'none', 5000);
            });
        }

        function fetchInitialAlerts() {
    document.getElementById('loading').style.display = 'block';
    const serviceType = document.getElementById('serviceFilter').value;
    const url = `/api/alerts${serviceType === 'all' ? '' : `?service_type=${serviceType}`}`;
    fetch(url)
        .then(response => {
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            return response.json();
        })
        .then(data => {
            console.log("Fetched alerts:", data);
            if (data.status === 200) {
                const tbody = document.getElementById('alertTable').querySelector('tbody');
                if (data.alerts.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9">No alerts found.</td></tr>';
} else {
                    tbody.innerHTML = ''; // Clear existing rows
                    data.alerts.forEach(alert => addAlertToTable(alert));
                }
            } else {
                throw new Error(data.error || 'Unknown error fetching alerts');
            }
        })
        .catch(error => {
            console.error("Fetch initial alerts error:", error);
            document.getElementById('errorMessage').textContent = `Initial Load Error: ${error.message}`;
            document.getElementById('errorMessage').style.display = 'block';
            setTimeout(() => document.getElementById('errorMessage').style.display = 'none', 5000);
        })
        .finally(() => {
            document.getElementById('loading').style.display = 'none';
        });
}

        function initializeSocket() {
            socket = io('http://172.16.31.2:5001', {
                transports: ['websocket', 'polling'],
                reconnection: true,
                reconnectionAttempts: 5,
                reconnectionDelay: 1000
            });

            socket.on('connect', () => {
                console.log('Connected to SocketIO');
                document.getElementById('errorMessage').style.display = 'none';
            });

            socket.on('new_alert', (alert) => {
                console.log('New alert received:', alert);
                addAlertToTable(alert);
            });

            socket.on('alert_updated', (alert) => {
                console.log('Alert updated:', alert);
                updateAlertInTable(alert);
            });

            socket.on('disconnect', () => {
                console.log('Disconnected from SocketIO');
                document.getElementById('errorMessage').textContent = 'Disconnected from server. Attempting to reconnect...';
                document.getElementById('errorMessage').style.display = 'block';
            });
        }

        window.onload = () => {
            initMap();
            initializeSocket();
            fetchInitialAlerts();
            document.getElementById('serviceFilter').addEventListener('change', fetchInitialAlerts);
        };
    </script>
</body>
</html>
